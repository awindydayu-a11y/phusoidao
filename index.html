<div class="ln"><span>ลูกหาบ ${pw().toFixed(1)} กก.</span><b>฿${fmt(po)}</b></div>${fl('อัตราลูกหาบ ต่อ กก. ต่อเที่ยว','rt','฿')}${fl('จำนวนเที่ยว (ขึ้น+ลง = 2)','wy','')}
${fl('ค่ารถแชร์','cr','฿')}${fl('ค่าอาหาร','fd','฿')}<div class="ln"><span>มัดจำขยะ (ได้คืนเมื่อเอาขยะลงมา)</span><b>฿200</b></div>
<div class="rw" style="margin-top:18px"><button data-a="copy" class="a">คัดลอกสรุปไปส่ง LINE</button></div>`;
return h}
function head(){const d=Math.max(0,Math.ceil((new Date(2026,10,28)-new Date())/864e5));
return `<div class="tg">ภูสอยดาว ลานสน 1,633 ม.</div><h1>เช็กลิสต์<br>เดินป่า 2 วัน 1 คืน</h1><div class="sub">28–29 พ.ย. 69 อากาศอาจเหลือราว 2°C ตอนเช้า</div><span class="cd0">อีก ${d} วัน</span> <button data-a="reset" style="margin-left:8px" class="${RS===1?'b':''}">${RS===1?'แตะอีกครั้งเพื่อรีเซ็ตแผนนี้':'รีเซ็ต'}</button>${plans()}`}
function draw(){const y=scrollY;$('#app').innerHTML=head()+[s1,s2,s3][S.tab-1]();
$('#nv').innerHTML=[[1,'1 คัดของ'],[2,'2 แพ็กของ'],[3,'3 งบ']].map(([k,l])=>`<button data-a="tab" data-v="${k}" class="${S.tab===k?'a':''}">${l}</button>`).join('');scrollTo(0,y)}
function toast(m){const t=$('#ts');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',1800)}
function summary(){const L=all().filter(i=>S.t[i.id]===1);let o='เช็กลิสต์ภูสอยดาว 28–29 พ.ย. 69\n';
[['p','ฝากลูกหาบ'],['s','แบกเอง']].forEach(([k,l])=>{o+='\n'+l+'\n';L.filter(i=>car(i)===k).forEach(i=>o+=(S.pk[i.id]?'✓ ':'☐ ')+i.n+(S.st[i.id]==='buy'?' (ซื้อ)':S.st[i.id]==='rent'?' (เช่า)':'')+'\n')});return o}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,id=b.dataset.id,v=b.dataset.v;
if(a!=='reset'&&a!=='pdel')RS=0;
if(a==='tab'){S.tab=+v;scrollTo(0,0)}
else if(a==='take'){S.t[id]=1}else if(a==='skip'){S.t[id]=0}else if(a==='st'){S.st[id]=v}
else if(a==='car'){S.ca[id]=v}else if(a==='al'){if(S.al[id]===+v)delete S.al[id];else S.al[id]=+v}
else if(a==='pk'){S.pk[id]=!S.pk[id]}else if(a==='td'){S.td[v]=!S.td[v]}else if(a==='flt'){S.f=v}
else if(a==='add'){const n=$('#cn').value.trim();if(!n){toast('ใส่ชื่อของก่อน');return}S.cu.push({n,c:+$('#cc').value});S.t['c'+(S.cu.length-1)]=1}
else if(a==='copy'){const s=summary();(navigator.clipboard?navigator.clipboard.writeText(s):Promise.reject()).then(()=>toast('คัดลอกแล้ว'),()=>toast('คัดลอกไม่สำเร็จ'));return}
else if(a==='pexp'){const c=btoa(unescape(encodeURIComponent(JSON.stringify({n:ROOT.plans[ROOT.cur].n,d:S}))));(navigator.clipboard?navigator.clipboard.writeText(c):Promise.reject()).then(()=>toast('คัดลอกรหัสแล้ว'),()=>{$('#pi').value=c;toast('คัดลอกเองจากช่องข้อความ')});return}
else if(a==='pimp'){try{const o=JSON.parse(decodeURIComponent(escape(atob($('#pi').value.trim())))),k=pid();ROOT.plans[k]={n:(o.n||'แผน')+' (นำเข้า)',d:fix(o.d)};ROOT.cur=k;S=ROOT.plans[k].d;toast('นำเข้าแล้ว')}catch(x){toast('รหัสไม่ถูกต้อง');return}}
else if(a==='sw'){ROOT.cur=v;S=ROOT.plans[v].d;scrollTo(0,0)}
else if(a==='pnew'||a==='pdup'){const pn=($('#pn').value||'').trim(),k=pid();ROOT.plans[k]=a==='pnew'?{n:pn||'แผน '+(Object.keys(ROOT.plans).length+1),d:mk()}:{n:pn||ROOT.plans[ROOT.cur].n+' (สำเนา)',d:JSON.parse(JSON.stringify(S))};ROOT.cur=k;S=ROOT.plans[k].d;toast('สร้างแผนแล้ว')}
else if(a==='pren'){const pn=($('#pn').value||'').trim();if(!pn){toast('พิมพ์ชื่อใหม่ก่อน');return}ROOT.plans[ROOT.cur].n=pn}
else if(a==='pdel'){if(Object.keys(ROOT.plans).length<2){toast('ต้องมีอย่างน้อย 1 แผน');return}if(RS!==2){RS=2;draw();return}RS=0;delete ROOT.plans[ROOT.cur];ROOT.cur=Object.keys(ROOT.plans)[0];S=ROOT.plans[ROOT.cur].d}
else if(a==='reset'){if(RS!==1){RS=1;draw();return}RS=0;ROOT.plans[ROOT.cur].d=mk();S=ROOT.plans[ROOT.cur].d;toast('รีเซ็ตแล้ว')}
save();draw()});
document.addEventListener('toggle',e=>{const o=e.target.dataset&&e.target.dataset.o;if(o)e.target.open?OP.add(o):OP.delete(o)},true);
document.addEventListener('change',e=>{const f=e.target.dataset.f;if(!f)return;const id=e.target.dataset.id,v=e.target.value;
if(f==='pr')S.pr[id]=v;else if(f==='kg')S.kg[id]=v;else S.fx[f]=v;save();draw()});
draw();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
